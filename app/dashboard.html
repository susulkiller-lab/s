<title>진앤솔 업무판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 휴대폰은 한 열 + 아래 탭 줄, 1024px 이상은 위 탭 + 두 열(왼쪽 오늘 카드, 오른쪽 이번 주 격자). 규격 근거는 docs/marketing-dashboard/04·06 */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F6F7F9; --ink:#191F28; --ink-2:#4E5866; --ink-3:#5F6874;
  --line:#E3E7EB; --track:#EAEDF0; --control:#848D99;
  --accent:#0F8F55; --accent-strong:#0B7A47; --on-accent:#FFFFFF; --accent-soft:#E6F6EE;
  --late:#B42318; --late-soft:#FDECEA; --stale:#8A5A00; --stale-soft:#FEF6E0; --data:#5B6B82; --focus:#2F6FDF;
  --shadow:0 4px 16px rgba(0,0,0,.12); --scrim:rgba(17,20,24,.45);
  --sans:"Inter","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r-card:16px; --r-ctl:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1114; --surface:#1A1D22; --surface-2:#22262C; --ink:#ECEEF1; --ink-2:#B3BAC3; --ink-3:#8C949E;
    --line:#2C3138; --track:#2E343B; --control:#6E7783;
    --accent:#2DB872; --accent-strong:#2DB872; --on-accent:#08130C; --accent-soft:#16301F;
    --late:#F2685C; --late-soft:#3A1D1A; --stale:#E0A93A; --stale-soft:#33290F; --data:#9AA8BC; --focus:#7EAAF5;
    --shadow:0 4px 16px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1114; --surface:#1A1D22; --surface-2:#22262C; --ink:#ECEEF1; --ink-2:#B3BAC3; --ink-3:#8C949E;
  --line:#2C3138; --track:#2E343B; --control:#6E7783;
  --accent:#2DB872; --accent-strong:#2DB872; --on-accent:#08130C; --accent-soft:#16301F;
  --late:#F2685C; --late-soft:#3A1D1A; --stale:#E0A93A; --stale-soft:#33290F; --data:#9AA8BC; --focus:#7EAAF5;
  --shadow:0 4px 16px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:600px;margin:0 auto}
svg.i{width:16px;height:16px;flex:none;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 머리줄 */
.head{display:flex;align-items:center;gap:8px;min-height:56px;padding-top:8px}
.head h1{font-size:20px;font-weight:700;margin:0;flex:1;min-width:0;letter-spacing:-.01em}
.head h1 small{display:block;font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.chip-btn{min-height:44px;padding:0 12px;border-radius:999px;color:var(--ink-2);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip-btn:hover{background:var(--surface-2)}
.icon-btn{width:44px;height:44px;border-radius:999px;display:inline-grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg.i{width:20px;height:20px}
.conn{font-size:12px;font-weight:500;color:var(--stale);background:var(--stale-soft);border-radius:999px;padding:4px 10px}
.htabs{display:none}
.focusline{font-size:13px;color:var(--ink-2);margin:0 0 8px}
.banner{background:var(--stale-soft);color:var(--stale);border-radius:var(--r-ctl);padding:12px 16px;font-size:14px;margin:8px 0}

/* 탭 줄 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar .in{display:flex;width:100%;max-width:600px}
.tab{flex:1;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;color:var(--ink-3)}
.tab svg.i{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"] svg.i{stroke:var(--accent);stroke-width:2.4}
.badge-n{min-width:18px;height:18px;border-radius:999px;background:var(--late);color:var(--surface);font-size:11px;font-weight:700;display:inline-grid;place-items:center;padding:0 5px;margin-left:2px}

/* 히어로 */
.card{background:var(--surface);border-radius:var(--r-card);padding:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero-top .lbl{font-size:13px;font-weight:500;color:var(--ink-2)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{min-height:32px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.gauge{position:relative;width:180px;margin:4px auto 0;aspect-ratio:200/176;max-width:100%}
.gauge>svg{width:100%;height:100%;display:block;overflow:visible}
.g-track,.g-fill{fill:none;stroke-width:14;stroke-linecap:round}
.g-track{stroke:var(--track)}
.g-fill{stroke:var(--accent);transition:stroke-dasharray .6s cubic-bezier(.22,1,.36,1),opacity .15s}
.g-tick{stroke:var(--control);stroke-width:2;stroke-linecap:round}
.g-mid{position:absolute;left:0;right:0;top:0;height:89%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.g-num{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1}
.g-num small{font-size:22px;font-weight:700;margin-left:1px}
.g-sub{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:15px;font-weight:500;color:var(--ink-2)}
.g-done{display:none;width:44px;height:44px;color:var(--accent)}
.gauge.full .g-done{display:block;animation:pop .28s cubic-bezier(.34,1.56,.64,1)}
.gauge.full .g-num{display:none}
.spark{position:absolute;left:50%;top:51%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--accent);opacity:0;pointer-events:none}
.gauge.party .spark{animation:spark .7s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:rotate(var(--a)) translateY(0)}100%{opacity:0;transform:rotate(var(--a)) translateY(-78px)}}
.hero-sub{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
.hero-sub .k{font-size:13px;color:var(--ink-2)}
.hero-sub .v{font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.hero-sub .s{font-size:13px;color:var(--ink-3)}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden;margin:6px 0 4px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px;transform-origin:left;transition:transform .6s cubic-bezier(.22,1,.36,1)}
.warn{display:flex;gap:8px;align-items:flex-start;text-align:left}
.warn>span>span{display:block}
.warn .v{display:flex;align-items:center;gap:6px}
.warn.on .v{color:var(--late)}
.warn.off .v{color:var(--ink-3);font-size:17px}
.warn svg.i{width:22px;height:22px}
.main-btn{width:100%;min-height:52px;border-radius:var(--r-ctl);background:var(--accent-strong);color:var(--on-accent);font-size:17px;font-weight:700;margin-top:16px}
.main-btn:hover{filter:brightness(1.06)}
.main-btn:disabled{opacity:.45;cursor:default}
.main-btn.danger{background:var(--late);color:var(--surface)}
.ck{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.ck input{width:20px;height:20px;accent-color:var(--accent)}
.sub-btn{min-height:44px;padding:0 16px;border-radius:var(--r-ctl);background:var(--surface-2);font-weight:500;font-size:15px}
.sub-btn:hover{background:var(--line)}
.link-btn{min-height:44px;color:var(--ink-2);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:4px}

/* 업무 카드와 행 */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 4px}
.sec-h h2{font-size:17px;font-weight:700;margin:0}
.sec-h .c{font-size:13px;color:var(--ink-3)}
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:8px;min-height:60px}
.rname{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;justify-content:center;min-height:52px;border-radius:8px}
.rname .t{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s}
.rname .t .tag{color:var(--ink-3);font-weight:400}
.rname .sub{font-size:13px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row.done .rname .t{opacity:.5}
.row.flash{animation:flash 1s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
.b{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;border-radius:999px;padding:2px 8px}
.b svg.i{width:14px;height:14px}
.b.late{color:var(--late);background:var(--late-soft)}
.b.stale{color:var(--stale);background:var(--stale-soft)}
.b.wait{color:var(--ink-3);background:var(--surface-2)}
.b.ok{color:var(--accent-strong);background:var(--accent-soft)}
.b.mute{color:var(--ink-3);background:transparent;padding:0}
.ctl{display:flex;align-items:center;gap:0;flex:none}
.dot{width:44px;height:44px;display:grid;place-items:center;border-radius:999px}
.dot::before{content:"";grid-area:1/1;width:28px;height:28px;border-radius:50%;border:2px solid var(--control);transition:background-color .15s,border-color .15s,transform .08s}
.dot svg{grid-area:1/1;width:16px;height:16px;fill:none;stroke:var(--on-accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .22s ease-out .05s}
.dot:active::before{transform:scale(.9)}
.dot.on::before{background:var(--accent);border-color:var(--accent)}
.dot.on svg{stroke-dashoffset:0}
.dot.on{cursor:default}
.dot.pop::before{animation:pop .24s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.frac{font-size:16px;font-weight:700;margin-right:4px}
.plus{width:44px;height:44px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:14px}
.plus:hover{background:var(--line)}
.more{min-height:44px;font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:4px;width:100%}
.empty{color:var(--ink-3);font-size:14px;padding:8px 0}
.twocol{display:grid;gap:12px}
.side{display:none}

/* 격자·표·막대 */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;font-weight:500;color:var(--ink-3);white-space:nowrap}
td.num{white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.grid td.c,.grid th.c{text-align:center;width:40px;padding:6px 2px}
.grid .ok{color:var(--accent)}
.grid .late{color:var(--late);font-weight:700}
.mini{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--track);vertical-align:middle;margin-right:6px;overflow:hidden}
.mini>i{display:block;height:100%;background:var(--accent)}
.hbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:7.5em 1fr 2.5em;gap:8px;align-items:center;font-size:14px}
.hb>span:first-child{min-width:0;overflow-wrap:anywhere}
.hb .tr{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--data)}
.hb .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border-radius:var(--r-card);padding:16px}
.tile .k{font-size:13px;color:var(--ink-2)}
.tile .v{font-size:24px;font-weight:700;letter-spacing:-.01em}
.tile .s{font-size:12px;color:var(--ink-3)}
.navper{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.navper .lbl{flex:1;min-width:0;text-align:center;font-weight:700;font-size:16px}
.muted{color:var(--ink-3);font-size:13px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:8px;align-items:center;justify-content:space-between;min-height:44px;border-bottom:1px solid var(--line);font-size:14px}
.list li:last-child{border-bottom:0}
.list .l{min-width:0;flex:1}
.rv{min-height:32px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.rv.todo{background:var(--stale-soft);color:var(--stale)}
.rv.asked{background:var(--accent-soft);color:var(--accent-strong)}

/* 시트 */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;box-shadow:var(--shadow);
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h3{font-size:20px;font-weight:700;margin:0 0 4px;text-wrap:balance}
.sheet .note{font-size:13px;color:var(--ink-2);margin:0 0 12px}
.sheet .row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.sheet .row-actions>*{flex:1 1 auto}
.fld{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.fld>label,.fld>.lb{font-size:13px;font-weight:500;color:var(--ink-2)}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;min-height:44px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--surface-2);padding:8px 12px;font-size:16px}
textarea{min-height:140px;resize:vertical;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;background:var(--surface-2);font-size:14px;font-weight:500;color:var(--ink-2);border:1px solid transparent}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-strong);border-color:var(--accent);font-weight:700}
.bigchips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bigchips .chip{min-height:52px;font-size:16px;border-radius:var(--r-ctl)}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paths .chip{min-height:48px;border-radius:var(--r-ctl)}
.pv{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.pv li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface-2);border-radius:10px;padding:8px 10px}
.pv li .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv li select{width:auto;min-height:36px;font-size:14px;padding:4px 8px}
.pv .gray{opacity:.6}
.err{color:var(--late);font-size:13px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;min-height:48px;max-width:calc(100% - 32px);
  background:var(--ink);color:var(--bg);border-radius:var(--r-ctl);box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:0 8px 0 16px;font-size:14px;animation:tin .2s ease-out}
.toast button{min-height:40px;padding:0 10px;font-weight:700;color:var(--bg);text-decoration:underline}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body.ro .w-only{display:none!important}
.adm-task{display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--line);min-height:52px}
.adm-task .l{flex:1;min-width:0;font-size:14px}
.adm-task .l small{display:block;color:var(--ink-3);font-size:12px}
.adm-task .icon-btn{width:36px;height:36px}
.form-box{background:var(--surface-2);border-radius:var(--r-ctl);padding:12px;margin-top:8px}
.form-box input,.form-box select{background:var(--surface)}
.inline{display:grid;grid-template-columns:1fr 1fr;gap:8px}

@media (min-width:1024px){
  body{padding-bottom:32px}
  .wrap{max-width:1200px}
  .tabbar{display:none}
  .htabs{display:flex;gap:4px}
  .htabs .tab{flex:none;flex-direction:row;height:44px;padding:0 14px;font-size:15px;border-radius:999px;gap:6px}
  .htabs .tab svg.i{width:18px;height:18px}
  .htabs .tab[aria-current="page"]{background:var(--surface)}
  .twocol{grid-template-columns:440px minmax(0,1fr);align-items:start;gap:24px}
  .side{display:flex}
  .gauge{width:240px}
  .g-track,.g-fill{stroke-width:16}
  .g-num{font-size:48px}
  .scrim{align-items:center}
  .sheet{border-radius:20px;max-height:82vh}
  .toast{bottom:32px}
}
@media (max-width:374px){.card{padding:16px}.tiles{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.15s!important;transition-delay:0s!important}
  .g-fill,.bar>i{transition:none!important}
}
</style>

<div class="wrap">
  <header class="head">
    <h1 id="h-date">업무판<small>불러오는 중</small></h1>
    <nav class="htabs" aria-label="화면" id="htabs"></nav>
    <span class="conn" id="conn" hidden>다시 연결하는 중이에요</span>
    <button class="chip-btn" id="me-btn" type="button" hidden></button>
    <button class="icon-btn" id="adm-btn" type="button" aria-label="업무 관리" hidden></button>
  </header>
  <div id="banner"></div>

  <section id="v-today" aria-label="오늘">
    <p class="focusline" id="focusline" hidden></p>
    <div class="twocol">
      <div class="stack">
        <div class="card" id="hero">
          <div class="hero-top"><span class="lbl" id="g-lbl">우리 팀 오늘</span>
            <div class="seg" role="group" aria-label="보기 범위"><button type="button" data-scope="team" aria-pressed="true">팀</button><button type="button" data-scope="me" aria-pressed="false">나</button></div></div>
          <div class="gauge" id="gauge" role="img" aria-label="오늘 진척">
            <svg viewBox="0 0 200 176" aria-hidden="true">
              <path class="g-track" d="M30.72 140 A80 80 0 1 1 169.28 140"/>
              <path class="g-fill" id="g-fill" pathLength="100" d="M30.72 140 A80 80 0 1 1 169.28 140" style="stroke-dasharray:0 100;opacity:0"/>
              <g id="g-ticks"></g>
            </svg>
            <div class="g-mid"><span class="g-num num" id="g-num">0<small>%</small></span>
              <svg class="g-done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg></div>
            <div class="g-sub num" id="g-sub">불러오는 중</div>

  $("scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet();});
  onMount?.(root.querySelector(".sheet"));const f=root.querySelector("input,textarea,select,button.chip,button.main-btn");f?.focus();}
function closeSheet(){$("sheet-root").innerHTML="";_opener?.focus?.();_opener=null;}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("sheet-root").innerHTML)closeSheet();});
const chips=(name,opts,val)=>`<div class="chips" role="group">${opts.map(([v,l])=>`<button type="button" class="chip" data-chip="${name}" data-v="${esc(v)}" aria-pressed="${v===val}">${esc(l)}</button>`).join("")}</div>`;
function chipVal(root,name){return root.querySelector(`[data-chip="${name}"][aria-pressed="true"]`)?.dataset.v??null;}
function wireChips(root,onChange){root.addEventListener("click",e=>{const b=e.target.closest("[data-chip]");if(!b)return;root.querySelectorAll(`[data-chip="${b.dataset.chip}"]`).forEach(x=>x.setAttribute("aria-pressed",String(x===b)));onChange?.(b.dataset.chip,b.dataset.v);});}

/* 붙여넣기 */
function matchTask(m){const td=today(),c=taskList().filter(X=>X.match===m&&active(X,td));return(c.find(X=>ver(X,td).assignee===S.me)||c[0])?.id||null;}
function hintTask(h){const map={"로톡":"lawtalk","티스토리":"tistory","블로그":"naver","플레이스":"place","네이버플레이스":"place","쇼츠":"shorts","홈페이지":"homepage","기사":"press","칼럼":"column"};
  const ch=Object.entries(map).find(([k])=>h&&h.includes(k))?.[1];if(!ch)return null;const td=today();return taskList().find(X=>X.ch===ch&&X.link&&active(X,td))?.id||null;}
function openPaste(fixed){const linkTasks=taskList().filter(X=>X.link&&active(X,today()));
  const title=fixed?`${esc(fixed.task.title)}에 넣을 링크`:"발행 보고 붙여넣기";
  sheet(`<h3 id="sh-t">${title}</h3><p class="note">${fixed?`${mdw(fixed.day)} 몫으로 기록해요.`:"단체방에 올린 보고 글을 그대로 붙여넣거나, 링크만 여러 줄 넣어도 돼요. 날짜 줄(예: 10/26(월)) 아래 링크는 그 날짜 몫이에요."}</p>
    <div class="fld"><label for="p-text">${fixed?"글 주소":"보고 글"}</label>${fixed?'<input type="text" id="p-text" inputmode="url" placeholder="https://">':'<textarea id="p-text" placeholder="10/26(월)&#10;&lt;로톡&gt;&#10;https://www.lawtalk.co.kr/posts/...&#10;제목"></textarea>'}</div>
    <div id="p-prev"></div>
    <div class="row-actions"><button type="button" class="main-btn" id="p-go" disabled>넣기</button>${fixed?'<button type="button" class="sub-btn" id="p-nolink">링크 없이 체크</button>':""}<button type="button" class="sub-btn" id="p-x">닫기</button></div>`,sh=>{
    let items=[];const prev=$("p-prev");
    const build=()=>{const raw=$("p-text").value;const td=today();
      items=(fixed?(raw.trim()?[{day:fixed.day,url:raw.trim().match(URL_RE)?.[0]||raw.trim(),title:"",hint:""}]:[]):parsePaste(raw,td)).map(it=>{const c=classify(it.url,it.title);
        let st="new",t=null;if(c.bad||c.notours)st="notours";else{t=fixed?fixed.task.id:c.match?matchTask(c.match):hintTask(it.hint);if(c.match&&!t&&!fixed)t=null;
          if(index().keys.has(c.key))st="dup";else if(!allowedDay(it.day))st="baddate";else if(!t)st="pick";}
        return{...it,...c,st,t};});
      const seenK=new Set();items.forEach(it=>{if(it.st==="new"||it.st==="pick"){if(seenK.has(it.key))it.st="dup";seenK.add(it.key);}});
      const groups={};items.filter(i=>i.st==="new").forEach(i=>{const g=groups[i.day]??={};const nm=S.tasks[i.t]?.title||"";g[nm]=(g[nm]||0)+1;});
      const pick=items.filter(i=>i.st==="pick"),gray=items.filter(i=>["dup","notours","baddate"].includes(i.st));
      const lab={dup:"이미 기록됨",notours:"우리 글 아님",baddate:"기록할 수 없는 날짜"};
      prev.innerHTML=!items.length?"":`<p class="note" style="margin-top:12px">${esc(S.members[S.me]?.name||"내")} 기록으로 넣어요.</p>
        ${pick.length?`<div class="lb muted">어느 업무인지 골라 주세요</div><ul class="pv">${pick.map(i=>`<li><span class="l">${md(i.day)} ${esc(i.title||i.url)}</span><select data-pick="${items.indexOf(i)}" aria-label="업무 고르기"><option value="">업무 고르기</option>${linkTasks.map(X=>`<option value="${X.id}">${esc(X.title)}</option>`).join("")}</select></li>`).join("")}</ul>`:""}
        ${Object.keys(groups).length?`<ul class="pv">${Object.entries(groups).sort().map(([d,g])=>`<li><span class="l">${mdw(d)} ${Object.entries(g).map(([n,c])=>`${esc(n)} ${c}`).join(" · ")}</span></li>`).join("")}</ul>`:""}
        ${gray.length?`<ul class="pv">${gray.map(i=>`<li class="gray"><span class="l">${lab[i.st]} · ${esc(i.title||i.url)}</span></li>`).join("")}</ul>`:""}`;
      prev.querySelectorAll("[data-pick]").forEach(s=>s.onchange=()=>{const it=items[+s.dataset.pick];it.t=s.value||null;upd();});upd();};
    const upd=()=>{$("p-go").disabled=!items.some(i=>i.st==="new"||(i.st==="pick"&&i.t));$("p-go").textContent=`넣기${items.filter(i=>i.st==="new"||(i.st==="pick"&&i.t)).length?" ("+items.filter(i=>i.st==="new"||(i.st==="pick"&&i.t)).length+"건)":""}`;};
    let _d;$("p-text").addEventListener("input",()=>{clearTimeout(_d);_d=setTimeout(build,200);});$("p-text").addEventListener("paste",()=>setTimeout(build,0));
    $("p-x").onclick=closeSheet;
    if(fixed)$("p-nolink").onclick=()=>{closeSheet();addEntry(fixed.task,fixed.day,fixed.row);};
    $("p-go").onclick=async()=>{const go=items.filter(i=>(i.st==="new"||i.st==="pick")&&i.t);if(!go.length)return;$("p-go").disabled=true;
      const b="b"+rid(),now=new Date().toISOString(),by={},list=[];
      for(const i of go){const X=S.tasks[i.t];(by[wkey(i.day)]??={})[i.key]={t:X.id,for:i.day,at:now,n:1,url:i.url,title:(i.title||"").slice(0,120),ch:X.ch,b};list.push([wkey(i.day),i.key]);}
      closeSheet();S.pop=fixed?.row||null;S.act=Date.now();vibrate();let ok=true;for(const[wk,ents]of Object.entries(by))ok=(await writeLog(wk,{entries:ents}))&&ok;
      if(ok)toast(`${go.length}건 기록했어요`,()=>voidEntries(list));};});}

/* 업무 상세 */
function openRow(r){if(r.Z)return openSpecial(r.Z);const X=r.X,td=today(),mon=monday(td),v=ver(X,td);
  const recs=index().all.filter(e=>e.t===X.id&&e.for>=add(mon,-7)).sort((a,b)=>a.at<b.at?1:-1);
  const canSkip=!S.ro&&(S.owner||v.assignee===S.me||v.assignee==="team");
  let grid="";if(X.kind==="daily"){const A=allocW(X,mon,"now");grid=`<div class="tbl-wrap"><table class="grid"><thead><tr>${A.days.slice(0,5).map(d=>`<th class="c">${DOWK[dow(d)]}</th>`).join("")}</tr></thead><tbody><tr>${A.days.slice(0,5).map((d,j)=>`<td class="c num">${A.T[j]?A.F[j]+"/"+A.T[j]:IX.skips[X.id+"_"+d]?"건너뜀":isBiz(d)?"·":"쉼"}</td>`).join("")}</tr></tbody></table></div>`;}
  const skipKey=X.kind==="daily"?X.id+"_"+td:X.kind==="weekly"?X.id+"_"+wkey(td):X.id+"_"+td.slice(0,7);
  const sk=IX.skips[skipKey];
  sheet(`<h3 id="sh-t">${esc(X.title)}</h3><p class="note">${who(v.assignee)} · ${KIND[X.kind]} ${v.qty}${X.unit}${X.kind==="weekly"?` · ${DOWK[+v.due||5]}요일 기한`:X.kind==="monthly"?" · 말일 기한":""}${X.link?" · 링크로 체크":""}</p>${grid}
    ${sk?`<p class="note">${X.kind==="daily"?"오늘":X.kind==="weekly"?"이번 주":"이번 달"}은 건너뜀${S.owner?" · "+WHY[sk.why]:""}</p>`:""}
    <div class="row-actions w-only"><button type="button" class="sub-btn" id="d-add">하나 더</button><button type="button" class="sub-btn" id="d-sub">하나 빼기</button>${X.link?'<button type="button" class="sub-btn" id="d-link">링크 붙이기</button>':""}</div>
    ${canSkip&&!sk?`<div class="fld w-only"><span class="lb">${X.kind==="daily"?"오늘":X.kind==="weekly"?"이번 주":"이번 달"} 건너뛰기 사유</span>${chips("why",Object.entries(WHY),null)}</div>`:""}
    <div class="fld"><span class="lb">최근 기록</span>${recs.length?`<ul class="list">${recs.slice(0,30).map(e=>`<li><span class="l">${mdw(e.for)} ${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title||"링크")}</a>`:"체크"}${e.void?" · 취소됨":""}</span><span class="muted">${who(e.uid)} ${hm(e.at)}</span></li>`).join("")}</ul>`:'<p class="empty">아직 기록이 없어요.</p>'}</div>
    <div class="row-actions"><button type="button" class="sub-btn" id="d-x">닫기</button></div>`,sh=>{
    $("d-x").onclick=closeSheet;
    $("d-add").onclick=()=>{closeSheet();hit(r,true);};
    $("d-link")&&($("d-link").onclick=()=>{closeSheet();openPaste({task:X,day:r.day||td,row:r.id});});
    $("d-sub").onclick=async()=>{const mineE=index().all.filter(e=>e.t===X.id&&e.uid===S.me&&valid(e,Infinity)).sort((a,b)=>a.at<b.at?1:-1)[0];
      if(!mineE)return toast("뺄 수 있는 내 기록이 없어요");closeSheet();await voidEntries([[mineE.wk,mineE.k]]);toast(`${X.title} 기록 하나를 뺐어요`);};
    wireChips(sh,async(n,v)=>{if(n!=="why")return;closeSheet();const ok=await writeLog(wkey(td),{skips:{[skipKey]:{why:v,at:new Date().toISOString()}}});if(ok)toast(`${X.title} 건너뛰었어요`,()=>writeLog(wkey(td),{skips:{[skipKey]:{void:new Date().toISOString()}}}));});});}
function hit(r,force){if(S.ro)return toast("기록 권한이 없는 계정이에요");if(!force&&r.f>=r.n&&r.n<=3)return;
  if(r.Z)return spAdd(r.Z,r.id);if(r.X.link)return openPaste({task:r.X,day:r.day||today(),row:r.id});addEntry(r.X,r.day||today(),r.id);}

/* 지시 */
function openSpecial(Z){const dn=spDone(Z,Infinity);
  sheet(`<h3 id="sh-t">${esc(Z.title)}</h3><p class="note">${who(Z.assignee)} · ${Z.qty}건 중 ${dn}건 · ${mdw(Z.due)}까지 · ${Z.src==="meeting"?"회의":Z.src==="order"?"지시":"기타"} ${Z.srcDay?md(Z.srcDay):""}</p>
    <div class="row-actions w-only"><button type="button" class="sub-btn" id="z-add">하나 체크</button><button type="button" class="sub-btn" id="z-sub">하나 빼기</button>${S.owner?'<button type="button" class="sub-btn" id="z-cancel">지시 취소</button>':""}</div>
    <div class="row-actions"><button type="button" class="sub-btn" id="z-x">닫기</button></div>`,()=>{
    $("z-x").onclick=closeSheet;$("z-add").onclick=()=>{closeSheet();spAdd(Z,"S"+Z.id);};
    $("z-sub").onclick=async()=>{const k=Object.entries(Z.done||{}).filter(([,e])=>e.by===S.me&&valid(e,Infinity)).sort((a,b)=>a[1].at<b[1].at?1:-1)[0]?.[0];
      if(!k)return toast("뺄 수 있는 내 기록이 없어요");closeSheet();const v=new Date().toISOString();S.sp[Z.id].done[k]={...S.sp[Z.id].done[k],void:v};dirty();await writeDoc("specials/"+Z.id,{done:{[k]:{void:v}}});};
    $("z-cancel")&&($("z-cancel").onclick=async()=>{closeSheet();S.sp[Z.id].status="cancelled";dirty();await writeDoc("specials/"+Z.id,{status:"cancelled",cancelledBy:S.me,cancelledAt:new Date().toISOString()});toast("지시를 취소했어요");});});}
function friday(td){const m=monday(td);let d=add(m,4);while(d>m&&!isBiz(d))d=add(d,-1);return d<td?td:d;}
function openSpNew(){const td=today(),mem=Object.entries(S.members).filter(([,m])=>m.active!==false).sort((a,b)=>(a[1].order??0)-(b[1].order??0));
  let src="order",srcDay=td;
  const form=()=>`<h3 id="sh-t">지시 추가</h3><p class="note">회의에서 나온 일이나 특별 지시를 담당과 마감과 함께 적어요.</p>
    <div class="fld"><label for="z-t">내용</label><input type="text" id="z-t" maxlength="40" placeholder="예: 홈페이지 배너 문구 수정"></div>
    <div class="fld"><label for="z-a">담당</label><select id="z-a">${mem.map(([u,m])=>`<option value="${u}"${u===S.me?" selected":""}>${esc(m.name)}</option>`).join("")}<option value="team">팀 공동</option></select></div>
    <div class="fld"><span class="lb">마감</span>${chips("due",[[td,"오늘"],[add(td,1),"내일"],[friday(td),"이번 주"],[friday(add(monday(td),7)),"다음 주"]],friday(td))}<input type="date" id="z-d" value="${friday(td)}" aria-label="마감 날짜 직접 고르기"></div>
    <div class="inline"><div class="fld"><label for="z-q">수량</label><input type="number" id="z-q" min="1" max="99" value="1"></div>
      <div class="fld"><label for="z-sd">나온 날</label><input type="date" id="z-sd" value="${srcDay}"></div></div>
    <div class="fld"><span class="lb">출처</span>${chips("src",[["meeting","회의"],["order","지시"],["etc","기타"]],src)}</div>
    <p class="err" id="z-err" hidden></p>
    <div class="row-actions"><button type="button" class="main-btn" id="z-save">저장</button><button type="button" class="sub-btn" id="z-more">저장하고 하나 더</button><button type="button" class="sub-btn" id="z-x">닫기</button></div>`;
  const mount=sh=>{wireChips(sh,(n,v)=>{if(n==="due")$("z-d").value=v;if(n==="src")src=v;});$("z-x").onclick=closeSheet;
    const save=async more=>{const t=$("z-t").value.trim(),due=$("z-d").value,q=Math.max(1,Math.min(99,+$("z-q").value||1));srcDay=$("z-sd").value||td;
      if(!t||!due){$("z-err").hidden=false;$("z-err").textContent="내용과 마감을 적어 주세요";return;}
      if(pii(t)){$("z-err").hidden=false;$("z-err").textContent="전화번호나 주민번호처럼 보여서 저장하지 않았어요";return;}
      const id="z"+rid(),now=new Date().toISOString(),Z={title:t,src,srcDay,assignee:$("z-a").value,qty:q,due,status:"open",done:{},createdBy:S.me,createdAt:now,updatedAt:now};
      S.sp[id]={id,...Z};dirty();const ok=await writeDoc("specials/"+id,Z,"set");if(!ok){delete S.sp[id];dirty();return;}
      toast("지시를 저장했어요");if(more){const keep=src;sheet(form(),mount);src=keep;}else closeSheet();};
    $("z-save").onclick=()=>save(false);$("z-more").onclick=()=>save(true);};
  sheet(form(),mount);}

/* 문의 기록 */
function openInqNew(){const td=today();let day=td,type=null,path=null,field=null,review=null,showMore=false;
  const body=()=>`<h3 id="sh-t">문의 기록</h3><p class="note">이름·연락처·사건 내용은 적지 않아요. 물어볼 말: "어떻게 알고 연락 주셨어요? 무엇을 검색하셨어요?"</p>
    <div class="fld"><span class="lb">날짜</span>${chips("day",[[td,"오늘"],[add(td,-1),"어제"]],day)}<input type="date" id="q-day" value="${day}" max="${td}" aria-label="날짜 직접 고르기"></div>
    <div class="fld"><span class="lb">유형</span><div class="bigchips">${Object.entries(TYPES).map(([v,l])=>`<button type="button" class="chip" data-chip="type" data-v="${v}" aria-pressed="${v===type}">${l}</button>`).join("")}</div></div>
    <div class="fld"><span class="lb">어디서 알고 왔나요</span><div class="paths">${PATHS.slice(0,showMore?11:6).map(([v,l])=>`<button type="button" class="chip" data-chip="path" data-v="${v}" aria-pressed="${v===path}">${l}</button>`).join("")}</div>
      ${showMore?"":'<button type="button" class="link-btn" id="q-more">경로 더보기 '+ICON.down+'</button>'}</div>
    <details id="q-opt"><summary class="link-btn">더 적기(선택)</summary>
      <div class="fld"><label for="q-term">검색어</label><input type="text" id="q-term" maxlength="30" placeholder="예: 음주운전 변호사">${chips("termx",[["모름","모름"]],null)}</div>
      <div class="fld"><span class="lb">분야</span>${chips("field",FIELDS.map(f=>[f,f]),field)}</div>
      <div class="fld"><label for="q-ref">참조번호</label><input type="text" id="q-ref" maxlength="20" placeholder="상담 기록 접수번호 또는 날짜-순번"></div>
      <div class="fld"><span class="lb">리뷰 요청</span>${chips("review",Object.entries(REV),review)}</div></details>
    <p class="err" id="q-err" hidden></p>
    <div class="row-actions"><button type="button" class="main-btn" id="q-save" disabled>저장</button><button type="button" class="sub-btn" id="q-again" disabled>저장하고 하나 더</button><button type="button" class="sub-btn" id="q-x">닫기</button></div>`;
  const mount=sh=>{const upd=()=>{$("q-save").disabled=$("q-again").disabled=!(type&&path);};upd();
    wireChips(sh,(n,v)=>{if(n==="day"){day=v;$("q-day").value=v;}if(n==="type")type=v;if(n==="path")path=v;if(n==="field")field=v;if(n==="review")review=v;if(n==="termx")$("q-term").value="모름";upd();});
    $("q-day").onchange=()=>{day=$("q-day").value||td;};$("q-x").onclick=closeSheet;
    $("q-more")&&($("q-more").onclick=()=>{showMore=true;sheet(body(),mount);});
    const save=async again=>{const term=$("q-term").value.trim(),ref=$("q-ref").value.trim();
      if(pii(term)||pii(ref)){$("q-err").hidden=false;$("q-err").textContent="전화번호나 주민번호처럼 보여서 저장하지 않았어요";return;}
      if(day>td){$("q-err").hidden=false;$("q-err").textContent="앞으로 올 날짜는 고를 수 없어요";return;}
      const rv=review||(type==="call"?"na":"todo"),now=new Date().toISOString(),ym=day.slice(0,7),id="q"+rid();
      const Q={day,type,path,term,field:field||"",ref,review:rv,askedDay:rv==="asked"?td:"",by:S.me,createdAt:now,updatedAt:now};
      ((S.inq[ym]??={}))[id]={id,...Q};dirty();const ok=await writeDoc(`inq/${ym}/items/${id}`,Q,"set");if(!ok){delete S.inq[ym][id];dirty();return;}
      toast("문의를 기록했어요");if(again){type=null;path=null;field=null;review=null;showMore=false;sheet(body(),mount);}else closeSheet();};
    $("q-save").onclick=()=>save(false);$("q-again").onclick=()=>save(true);};
  sheet(body(),mount);}

/* ---------- 문의 탭 ---------- */
function period(o,kind){const td=today();
  if(kind==="day"){const d=add(td,o.off);return{from:d,to:d,label:mdw(d),prev:{from:add(d,-1),to:add(d,-1)},key:d};}
  if(kind==="week"){const m=add(monday(td),7*o.off);return{from:m,to:add(m,6),label:`${md(m)} ~ ${md(add(m,6))}`,prev:{from:add(m,-7),to:add(m,-1)},key:wkey(m)};}
  const ym=shiftYM(td.slice(0,7),o.off),pm=shiftYM(ym,-1);return{from:ym+"-01",to:lastDay(ym),label:`${+ym.slice(0,4)}년 ${+ym.slice(5)}월`,prev:{from:pm+"-01",to:lastDay(pm)},key:ym};}
function inqIn(from,to){const o=[];for(const ym of Object.keys(S.inq))for(const q of Object.values(S.inq[ym]))if(q.day>=from&&q.day<=to)o.push(q);return o.sort((a,b)=>a.day<b.day?1:-1);}
function inqStats(list){const by=(f)=>{const o={};for(const q of list){const k=f(q);if(k)o[k]=(o[k]||0)+1;}return Object.entries(o).sort((a,b)=>b[1]-a[1]);};

      let due=$("n-due").value;if(kind==="monthly"&&due!=="last")due="last";if(kind==="weekly"&&due==="last")due="5";
      const id="t"+rid(),X={title:t,ch:$("n-ch").value,kind,unit:$("n-u").value,link:$("n-l").checked,match:"",versions:[{from:st,qty:Math.max(1,+$("n-q").value||1),due:kind==="daily"?0:kind==="weekly"?+due:"last",assignee:$("n-a").value}],pauses:[],startAt:st,endAt:"",order:ts.length,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
      S.tasks[id]={id,...X};dirty();const ok=await writeDoc("tasks/"+id,X,"set");if(ok){toast("업무를 추가했어요");openAdmin("tasks");}else{delete S.tasks[id];dirty();}});
    sh.querySelectorAll("[data-mmv]").forEach(b=>b.onclick=async()=>{const i=mem.findIndex(([u])=>u===b.dataset.mmv),j=i+ +b.dataset.d;if(j<0||j>=mem.length)return;
      await writeDoc("members/"+mem[i][0],{order:j});await writeDoc("members/"+mem[j][0],{order:i});S.members[mem[i][0]].order=j;S.members[mem[j][0]].order=i;openAdmin("members");});
    sh.querySelectorAll("[data-act-m]").forEach(b=>b.onclick=async()=>{const u=b.dataset.actM,a=S.members[u].active===false;S.members[u].active=a;await writeDoc("members/"+u,{active:a});openAdmin("members");});
    sh.querySelectorAll("[data-hdel]").forEach(b=>b.onclick=async()=>{const d=b.dataset.hdel;S.cfg.holidays[d]=null;dirty();await writeDoc("config/main",{holidays:{[d]:null},updatedAt:new Date().toISOString()});openAdmin("holidays");});
    $("h-add")&&($("h-add").onclick=async()=>{const d=$("h-d").value,n=$("h-n").value.trim()||"휴무";if(!d)return toast("날짜를 골라 주세요");
      if(d<td)toast("지난 날짜라 그날 목표와 기록 숫자가 바뀌어요");(S.cfg.holidays??={})[d]=n;dirty();
      await(S.cfgExists?writeDoc("config/main",{holidays:{[d]:n},updatedAt:new Date().toISOString()}):writeDoc("config/main",{holidays:{...S.cfg.holidays},updatedAt:new Date().toISOString()},"set"));openAdmin("holidays");});});}
function openTaskEdit(X){const td=today(),v=ver(X,td),mem=Object.entries(S.members).filter(([,m])=>m.active!==false);
  sheet(`<h3 id="sh-t">${esc(X.title)} 편집</h3><p class="note">${KIND[X.kind]} 업무 · 주기는 바꿀 수 없어요(그만한 뒤 새 업무로 만들어요).</p>
    <div class="fld"><label for="e-t">이름</label><input type="text" id="e-t" maxlength="20" value="${esc(X.title)}"></div>
    <div class="inline"><div class="fld"><label for="e-q">목표 수량</label><input type="number" id="e-q" min="0" max="20" value="${v.qty}"></div>
      <div class="fld"><label for="e-a">담당</label><select id="e-a">${mem.map(([u,m])=>`<option value="${u}"${u===v.assignee?" selected":""}>${esc(m.name)}</option>`).join("")}<option value="team"${v.assignee==="team"?" selected":""}>팀 공동</option></select></div></div>
    ${X.kind==="weekly"?`<div class="fld"><label for="e-d">기한 요일</label><select id="e-d">${[1,2,3,4,5].map(i=>`<option value="${i}"${+v.due===i?" selected":""}>${DOWK[i]}요일</option>`).join("")}</select></div>`:""}
    <div class="fld"><label><input type="checkbox" id="e-l"${X.link?" checked":""}> 링크로 체크(발행 업무)</label></div>
    <div class="fld"><span class="lb">수량·담당·기한 적용 시작</span>${chips("from",[[X.kind==="monthly"?shiftYM(td.slice(0,7),1)+"-01":nextMon(),X.kind==="monthly"?"다음 달부터":"다음 주부터"],[td,"오늘부터"]],X.kind==="monthly"?shiftYM(td.slice(0,7),1)+"-01":nextMon())}</div>
    <div class="row-actions"><button type="button" class="main-btn" id="e-save">저장</button></div>
    <details class="form-box"><summary class="link-btn">쉬기·그만하기</summary>
      <div class="inline"><div class="fld"><label for="e-pf">쉬기 시작</label><input type="date" id="e-pf" min="${td}" value="${td}"></div><div class="fld"><label for="e-pt">쉬기 끝</label><input type="date" id="e-pt" min="${td}" value="${add(td,6)}"></div></div>
      <div class="row-actions"><button type="button" class="sub-btn" id="e-pause">이 기간 쉬기</button><button type="button" class="sub-btn" id="e-stop">오늘로 그만하기</button></div></details>
    <div class="row-actions"><button type="button" class="sub-btn" id="e-x">돌아가기</button></div>`,sh=>{
    let from=X.kind==="monthly"?shiftYM(td.slice(0,7),1)+"-01":nextMon();wireChips(sh,(n,val)=>{if(n==="from")from=val;});
    $("e-x").onclick=()=>openAdmin("tasks");
    $("e-save").onclick=async()=>{const nv={from,qty:Math.max(0,Math.min(20,+$("e-q").value||0)),due:X.kind==="weekly"?+$("e-d").value:v.due,assignee:$("e-a").value};
      const changed=nv.qty!==v.qty||nv.assignee!==v.assignee||nv.due!==v.due;let vs=X.versions.filter(x=>x.from<from);if(changed)vs=[...vs,nv];else vs=X.versions;
      const patch={title:$("e-t").value.trim()||X.title,link:$("e-l").checked,versions:vs,updatedAt:new Date().toISOString()};
      Object.assign(S.tasks[X.id],patch);dirty();if(await writeDoc("tasks/"+X.id,patch)){toast("저장했어요");openAdmin("tasks");}};
    $("e-pause").onclick=async()=>{const f=$("e-pf").value,t=$("e-pt").value;if(!f||!t||t<f)return toast("쉬기 기간을 확인해 주세요");
      const pauses=[...(X.pauses||[]),{from:f,to:t}];S.tasks[X.id].pauses=pauses;dirty();if(await writeDoc("tasks/"+X.id,{pauses}))toast(`${md(f)}~${md(t)} 쉬어요`);openAdmin("tasks");};
    $("e-stop").onclick=async()=>{const has=index().all.some(e=>e.t===X.id);
      if(!has){delete S.tasks[X.id];dirty();await writeDoc("tasks/"+X.id,{},"delete");toast("기록이 없어 업무를 지웠어요");}
      else{S.tasks[X.id].endAt=td;dirty();await writeDoc("tasks/"+X.id,{endAt:td});toast("오늘까지만 하고 그만해요. 기록은 남아요");}openAdmin("tasks");};});}
// 업무 목록 비우기: 반복 업무를 지워 [초기 업무 불러오기]가 다시 나오게 한다. 지시·체크 기록·문의는 골라서 함께 지운다
function openWipe(){const sps=Object.keys(S.sp),logs=[];for(const[u,ws]of Object.entries(S.logs))for(const wk of Object.keys(ws))logs.push(`logs/${u}/w/${wk}`);
  const inq=[];for(const[ym,items]of Object.entries(S.inq))for(const id of Object.keys(items))inq.push(`inq/${ym}/items/${id}`);
  sheet(`<h3 id="sh-t">업무 목록 비우기</h3><p class="note">반복 업무 ${taskList().length}개를 지워요. 비우면 오늘 화면에 [초기 업무 불러오기]가 다시 나와요. 지운 것은 되돌릴 수 없어요.</p>
    <label class="ck"><input type="checkbox" id="w-s" ${sps.length?"checked":"disabled"}> 지시 ${sps.length}건도 지우기</label>
    <label class="ck"><input type="checkbox" id="w-l" ${logs.length?"checked":"disabled"}> 체크·붙여넣기 기록도 모두 지우기 <span class="muted">(팀 전체 ${logs.length}주치)</span></label>
    ${S.inqOK?`<label class="ck"><input type="checkbox" id="w-q" ${inq.length?"":"disabled"}> 문의 기록 ${inq.length}건도 지우기</label>`:""}
    <div class="row-actions"><button type="button" class="main-btn danger" id="w-go">비우기</button><button type="button" class="sub-btn" id="w-x">취소</button></div>`,()=>{
    $("w-x").onclick=()=>openAdmin("tasks");
    $("w-go").onclick=async()=>{$("w-go").disabled=true;const paths=[...Object.keys(S.tasks).map(id=>"tasks/"+id),...($("w-s").checked?sps.map(id=>"specials/"+id):[]),...($("w-l").checked?logs:[]),...($("w-q")?.checked?inq:[])];
      const wipeSp=$("w-s").checked;closeSheet();S.tasks={};if(wipeSp)S.sp={};
      for(const path of paths)await writeDoc(path,{},"delete");
      if(paths.some(x=>x.startsWith("logs/"))){S.pend={};S.known.clear();}
      S.seen.clear();S.prevPct=null;dirty();go("today");toast(`${paths.length}개 항목을 지웠어요`);};});}
async function seed(){const b=$("seed-btn");if(b)b.disabled=true;const td=today(),now=new Date().toISOString();
  for(const[i,[title,ch,kind,unit,qty,due,link,match]]of SEED.entries()){const id="t"+rid(),X={title,ch,kind,unit,link:!!link,match,versions:[{from:td,qty,due,assignee:"team"}],pauses:[],startAt:td,endAt:"",order:i,createdAt:now,updatedAt:now};
    if(!await writeDoc("tasks/"+id,X,"set"))return;S.tasks[id]={id,...X};}
  if(!S.cfgExists)await writeDoc("config/main",{holidays:{"2026-12-25":"성탄절","2027-01-01":"새해 첫날"},updatedAt:now,updatedBy:S.me},"set");
  await writeDoc("inq/probe",{ok:true},"set");S.inqOK=true;subInq();toast("초기 업무 14개를 불러왔어요");dirty();}

/* ---------- 이벤트 ---------- */
document.addEventListener("click",e=>{const t=e.target.closest("button,[data-go]");if(!t||!S.db)return;index();const d=t.dataset;
  if(d.tab)return go(d.tab);
  if(d.scope){S.scope=d.scope;S.seen.clear();S.prevPct=null;$("g-fill").style.transition="none";return render();}
  if(d.hit){const r=S.R[d.hit];if(r)hit(r);return;}
  if(d.open){const r=S.R[d.open];if(r)openRow(r);return;}
  if(d.more){S.open[d.more]=!S.open[d.more];return render();}
  if(d.go==="lastweek"){S.rec={kind:"week",off:-1,init:true};return go("rec");}
  if(d.iqk){S.iq={kind:d.iqk,off:0};return render();}
  if(d.iqo){S.iq.off+= +d.iqo;return render();}
  if(d.rk){S.rec.kind=d.rk;S.rec.off=0;return render();}
  if(d.ro){S.rec.off+= +d.ro;loadNote(period(S.rec,S.rec.kind).key);return render();}
  if(d.rv){const q=S.inq[d.ym]?.[d.rv];if(!q||S.ro)return;const td=today();Object.assign(q,{review:"asked",askedDay:td});dirty();
    writeDoc(`inq/${d.ym}/items/${d.rv}`,{review:"asked",askedDay:td,updatedAt:new Date().toISOString()});toast("리뷰 요청함으로 바꿨어요",()=>{Object.assign(q,{review:"todo",askedDay:""});dirty();writeDoc(`inq/${d.ym}/items/${d.rv}`,{review:"todo",askedDay:""});});return;}
  if(d.qdel){const ym=d.ym,id=d.qdel,q=S.inq[ym]?.[id];if(!q)return;delete S.inq[ym][id];dirty();writeDoc(`inq/${ym}/items/${id}`,{},"delete");
    toast("문의 기록을 지웠어요",()=>{const{id:_i,...rest}=q;S.inq[ym][id]=q;dirty();writeDoc(`inq/${ym}/items/${id}`,rest,"set");});return;}
  switch(d.act){case"sp-new":return openSpNew();case"inq-new":return openInqNew();case"export":return openExport();
    case"inq-todo":S.iq.todoOnly=true;return render();case"inq-all":S.iq.todoOnly=false;return render();
    case"note-save":{const f=$("n-f").value.trim(),m=$("n-m").value;if(pii(f)||pii(m))return toast("전화번호나 주민번호처럼 보여서 저장하지 않았어요");
      S.notes[d.k]={focus:f,memo:m};writeDoc("notes/"+d.k,{focus:f,memo:m,updatedAt:new Date().toISOString(),updatedBy:S.me},"set").then(ok=>ok&&toast("메모를 저장했어요"));renderHead();return;}
    case"reset-day":return openReset(d.k);
    case"close-week":{const p=period(S.rec,"week");writeClosed(p,"week");toast("주간 마감을 저장했어요");return;}}
  if(t.id==="paste-btn")return openPaste(null);
  if(t.id==="warn"){const c=$("c-late");c?.scrollIntoView({behavior:RM.matches?"auto":"smooth",block:"start"});return;}
  if(t.id==="me-btn")return openMe(!S.members[S.me]?.createdAt);
  if(t.id==="adm-btn")return openAdmin();
  if(t.id==="seed-btn")return seed();});

/* ---------- 연결 ---------- */
function sub(key,ref,next){S.subs[key]?.();let delay=2000;
  const go=()=>{S.subs[key]=ref.onSnapshot(s=>{delay=2000;setConn(true);next(s);},e=>{const c=e?.code;
    if(c==="revoked")return setRO("이 화면의 권한이 바뀌었어요. 새로 열어 주세요");if(c==="invalid_argument")return next(null);
    setConn(false);setTimeout(go,delay);delay=Math.min(60000,delay*2);});};go();}
const docs=s=>Object.fromEntries((s?.docs||[]).map(d=>[d.id,{id:d.id,...d.data()}]));
function subLogs(uid){if(S.subs["logs:"+uid])return;const from=wkey(add(today(),-91));
  sub("logs:"+uid,S.db.collection(`logs/${uid}/w`).where("week",">=",from),s=>{const o={};for(const d of s?.docs||[])o[d.id]=d.data();S.logs[uid]=o;S.loaded.logs=true;dirty();});}
function subInq(){if(!S.inqOK)return;const ym=today().slice(0,7);for(let i=0;i<3;i++){const m=shiftYM(ym,-i);if(!S.subs["inq:"+m])sub("inq:"+m,S.db.collection(`inq/${m}/items`),s=>{S.inq[m]=docs(s);dirty();});}}
function loadNote(key){if(!key||!/W/.test(key)||S.notes[key]!==undefined)return;S.notes[key]={};S.db.doc("notes/"+key).get().then(g=>{if(g.exists){S.notes[key]=g.data();schedule();}}).catch(()=>{});}
(async()=>{S.loaded={};
  const C=window.claude;if(!C?.use){$("banner").innerHTML='<p class="banner">이 화면은 claude.ai에서 열어야 기록할 수 있어요.</p>';$("g-sub").textContent="연결 안 됨";return;}
  C.use("downloads").then(dl=>{S.dl=dl;schedule();});
  const[db,user]=await Promise.all([C.use("db"),C.use("user")]);
  if(!db){$("banner").innerHTML='<p class="banner">업무판 저장소에 연결되지 않았어요. claude.ai에 로그인한 상태로 다시 열어 주세요.</p>';$("g-sub").textContent="연결 안 됨";return;}
  S.db=db;S.user=user;
  if(user){try{S.me=await user.id();}catch(_){}try{S.owner=!!await user.isOwner();}catch(_){}
    try{const w=await user.can("data.write");if(w===false)S.noWrite=true;}catch(_){}}
  S.ro=!S.me||!!S.noWrite;document.body.classList.toggle("ro",S.ro);S.scope=S.owner?"team":"me";
  if(!S.me)$("banner").innerHTML='<p class="banner">이 계정은 신원 확인이 안 돼 기록할 수 없어요. 관리 담당에게 알려 주세요.</p>';
  sub("config",db.doc("config/main"),s=>{S.cfgExists=!!s?.exists;S.cfg={holidays:{},...(s?.exists?s.data():{})};dirty();});
  sub("members",db.collection("members"),s=>{S.members=docs(s);S.membersLoaded=true;for(const u of Object.keys(S.members))subLogs(u);
    if(S.me&&!S.ro&&!S.members[S.me]&&!S.askedName){S.askedName=true;openMe(true);}dirty();});
  sub("tasks",db.collection("tasks"),s=>{S.tasks=docs(s);S.tasksLoaded=true;dirty();});
  sub("sp",db.collection("specials").orderBy("createdAt","desc").limit(300),s=>{S.sp=docs(s);dirty();});
  if(S.me)subLogs(S.me);
  const wk=wkey(today());sub("note",db.doc("notes/"+wk),s=>{S.notes[wk]=s?.exists?s.data():{};schedule();});
  db.doc("inq/probe").get().then(g=>{S.inqOK=!!g.exists||S.owner;subInq();schedule();}).catch(()=>{S.inqOK=S.owner;subInq();schedule();});
  S.ready=true;render();
  let day=today();setInterval(()=>{if(today()!==day){day=today();S.seen.clear();S.prevPct=null;dirty();}},60000); // 자정에는 다시 그리기만 한다
})();
</script>
